<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Human Thing – 5.9.26</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500&display=swap');

    body {
        margin: 0;
        padding: 20px;
        background: #0d0d0d;
        color: #e8e8e8;
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
    }

    h1, h2 {
        font-family: 'Orbitron', sans-serif;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #7dfbff;
        text-shadow: 0 0 6px #00eaff;
        margin-bottom: 10px;
    }

    h1 {
        font-size: 1.8rem;
        text-align: center;
    }

    .section {
        background: rgba(0, 0, 0, 0.6);
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 25px;
        border: 1px solid rgba(0, 255, 255, 0.25);
    }

    .chords {
        font-family: "Courier New", monospace;
        font-size: 1.2rem;
        white-space: pre-wrap;
        color: #ff9dfc;
        text-shadow: 0 0 4px #ff4dfc;
    }

    .diagram-row {
        display: flex;
        gap: 20px;
        margin-top: 15px;
        flex-wrap: wrap;
    }

    .diagram {
        width: 120px;
        text-align: center;
        font-size: 1rem;
        color: #7dfbff;
        text-shadow: 0 0 4px #00eaff;
    }

    svg {
        width: 100%;
        height: auto;
        stroke: #e8e8e8;
        fill: none;
        stroke-width: 2.5;
    }
</style>
</head>
<body>

<h1>Human Thing — 5.9.26</h1>
<h2>Guitar</h2>

<!-- SECTION 1 -->
<div class="section">
    <h2>Section 1 — Riff</h2>

    <div class="chords">
Delay part A mostly

A   C#   D ×2  
A   C#   D ×2  

F#m
    </div>

    <div class="diagram-row">
        <!-- F#m -->
        <div class="diagram">
            <div>F#m</div>
            <svg viewBox="0 0 140 160">
                <line x1="20" y1="20" x2="20" y2="140"/>
                <line x1="40" y1="20" x2="40" y2="140"/>
                <line x1="60" y1="20" x2="60" y2="140"/>
                <line x1="80" y1="20" x2="80" y2="140"/>
                <line x1="100" y1="20" x2="100" y2="140"/>
                <line x1="120" y1="20" x2="120" y2="140"/>

                <line x1="20" y1="40" x2="120" y2="40"/>
                <line x1="20" y1="60" x2="120" y2="60"/>
                <line x1="20" y1="80" x2="120" y2="80"/>
                <line x1="20" y1="100" x2="120" y2="100"/>
                <line x1="20" y1="120" x2="120" y2="120"/>

                <rect x="20" y="40" width="100" height="12" rx="6" fill="#eee"/>

                <circle cx="60" cy="80" r="8"/>
                <circle cx="80" cy="100" r="8"/>
                <circle cx="100" cy="100" r="8"/>
            </svg>
        </div>
    </div>
</div>

A   D  
A   D  

F#m   D   A   G#m   F#m

C#m (in the riff)

</body>
</html>
